[package]
name = "tai"
version = "0.1.0"
edition = "2021"
description = "Fast multithreaded desktop inference for the PLE TinyLM"
license = "MIT"
repository = "https://github.com/AnEntrypoint/tai"

[[bin]]
name = "tai"
path = "tai/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
libm = "0.2"
memmap2 = "0.9"
num_cpus = "1"
rand = "0.9"
rayon = "1.10"
tokenizers = { version = "0.21", default-features = false, features = ["fancy-regex"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
